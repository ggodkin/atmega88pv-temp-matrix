[env:atmega88pv]
platform = atmelavr
board = atmega88pv
framework = arduino
board_build.f_cpu = 8000000L

upload_protocol = usbasp

upload_flags =
  -B 20
  -e
  -s
  -Ulock:w:0x3F:m
  -Uflash:w:.pio/build/atmega88pv/firmware.hex:i
  -Uflash:v:.pio/build/atmega88pv/firmware.hex:i

build_flags =
  -Os
  -ffunction-sections
  -fdata-sections

monitor_speed = 115200
